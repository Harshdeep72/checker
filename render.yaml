databases:
  - name: redditchecker-db
    databaseName: redditchecker
    user: admin
    plan: free

services:
  # Redis
  - type: redis
    name: redditchecker-redis
    plan: free
    ipAllowList: []

  # Web Service (FastAPI + Celery)
  - type: web
    name: redditchecker-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: redditchecker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redditchecker-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redditchecker-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redditchecker-redis
          type: redis
          property: connectionString
    rootDir: backend

  # Static Site (Vite)
  - type: web
    name: redditchecker-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: redditchecker-backend
          envVarKey: RENDER_EXTERNAL_URL
    rootDir: frontend
